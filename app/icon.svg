<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KN">
  <!--
    Typographic monogram, drawn as paths so it renders identically without a
    webfont. Same near-black ground and off-white as the site; no separate
    visual identity, no new mark.
  -->
  <rect width="64" height="64" rx="12" fill="#0a0a0c" />

  <!-- K -->
  <path d="M12 17h5.4v12.1L27.8 17h6.6L23.9 29.4 34.9 47h-6.5l-8.2-13.3-2.8 3.2V47H12z" fill="#f2f2f4" />

  <!-- N -->
  <path d="M38 47V17h5.2l8.6 19.3V17H57v30h-5.2l-8.6-19.2V47z" fill="#f2f2f4" />

  <!-- The accent hairline the whole site is built on. -->
  <rect x="12" y="52" width="40" height="2" fill="#4f7cff" />
</svg>
